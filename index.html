<!doctype html>
<html lang="en" data-theme="dark" data-accent="ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b0f1d" />
    <meta name="google-site-verification" content="HJwjk4c_JUk7luOUopka_h8lTzYPTK7rdQE9YiXaZ60" />
    <meta name="description" content="Bite-sized singing lessons that listen back. Pip, your pocket vocal coach, hears every note and cheers every win." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Belto · Find your voice</title>
    <script>
      // Pick the theme before first paint so there's no flash.
      try {
        var saved = JSON.parse(localStorage.getItem('belto-progress') || '{}').state || {};
        var pref = saved.theme || 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.accent = saved.accent || 'ember';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
